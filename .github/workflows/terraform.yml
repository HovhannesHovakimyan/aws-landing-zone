name: Terraform Network Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "terraform/**/*.tf"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/network-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Validate ORG_ARN input
        env:
          ORG_ARN: ${{ vars.ORG_ARN || secrets.ORG_ARN }}
        run: |
          if [[ -z "$ORG_ARN" ]]; then
            echo "::error::ORG_ARN is required. Set repository variable ORG_ARN or secret ORG_ARN to your AWS Organization ARN."
            exit 1
          fi

          if [[ ! "$ORG_ARN" =~ ^arn:aws(-[a-z]+)?:organizations::[0-9]{12}:organization/o-[a-z0-9-]+$ ]]; then
            echo "::error::ORG_ARN is invalid: '$ORG_ARN'"
            echo "::error::Expected format: arn:aws:organizations::<management-account-id>:organization/o-xxxxxxxxxx"
            exit 1
          fi

      - name: Debug ORG_ARN parts
        if: ${{ vars.ENABLE_ORG_ARN_DEBUG == 'true' }}
        env:
          ORG_ARN: ${{ vars.ORG_ARN || secrets.ORG_ARN }}
        run: |
          if [[ "$ORG_ARN" =~ ^arn:aws(-[a-z]+)?:organizations::([0-9]{12}):organization/(o-[a-z0-9-]+)$ ]]; then
            echo "ORG_ARN format check: OK"
            echo "Management account id: ${BASH_REMATCH[2]}"
            echo "Organization id: ${BASH_REMATCH[3]}"
            echo "ARN preview: ${ORG_ARN:0:30}...${ORG_ARN: -8}"
          else
            echo "::warning::ORG_ARN could not be parsed by debug step."
          fi

      - name: Guard ORG_ARN matches caller organization
        env:
          ORG_ARN: ${{ vars.ORG_ARN || secrets.ORG_ARN }}
        run: |
          set -euo pipefail

          CALLER_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ACTUAL_ORG_ARN=$(aws organizations describe-organization --query 'Organization.Arn' --output text)

          if [[ "$ORG_ARN" != "$ACTUAL_ORG_ARN" ]]; then
            echo "::error::ORG_ARN does not match the organization of the assumed AWS account."
            echo "::error::Caller account: $CALLER_ACCOUNT_ID"
            echo "::error::Provided ORG_ARN: $ORG_ARN"
            echo "::error::Actual organization ARN for caller account: $ACTUAL_ORG_ARN"
            exit 1
          fi

          echo "Caller account and ORG_ARN are consistent."

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var "organization_arn=${{ vars.ORG_ARN || secrets.ORG_ARN }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
